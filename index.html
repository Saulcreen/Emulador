<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estante GBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #14121a;
    --bg-panel: #1e1b28;
    --bg-panel-raised: #262233;
    --shell: #6b4fa0;
    --shell-bright: #9b7fd6;
    --screen-glow: #9fe870;
    --screen-glow-dim: #5a8a44;
    --text-primary: #f2eef9;
    --text-muted: #a89dc0;
    --danger: #d1637a;
    --danger-bright: #e888a0;
    --border-soft: #352f47;
    --radius-cart: 10px;
    --font-pixel: 'Press Start 2P', monospace;
    --font-body: 'Inter', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(107,79,160,0.16), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(159,232,112,0.06), transparent 40%);
    background-attachment: fixed;
  }

  a{ color: inherit; }
  button{ font-family: var(--font-body); cursor: pointer; }

  button:focus-visible, input:focus-visible{
    outline: 2px solid var(--screen-glow);
    outline-offset: 2px;
  }

  .app{
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark{
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: linear-gradient(155deg, var(--shell-bright), var(--shell));
    position: relative;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15);
  }
  .brand-mark::after{
    content: "";
    position: absolute;
    top: 8px; left: 8px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--screen-glow);
    box-shadow: 0 0 6px var(--screen-glow);
  }

  .brand h1{
    font-family: var(--font-pixel);
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
    letter-spacing: 0.5px;
  }
  .brand p{
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .btn{
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .btn:active{ transform: scale(0.97); }

  .btn-primary{ background: var(--shell-bright); color: #171425; }
  .btn-primary:hover{ background: #ac93e0; }

  .btn-ghost{ background: transparent; color: var(--text-primary); border: 1px solid var(--border-soft); }
  .btn-ghost:hover{ border-color: var(--shell-bright); }

  .btn-danger{ background: transparent; color: var(--danger); border: 1px solid rgba(209,99,122,0.4); }
  .btn-danger:hover{ background: rgba(209,99,122,0.12); color: var(--danger-bright); }

  #rom-input, #cover-input{ display: none; }

  .shelf-heading{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .shelf-heading h2{
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    margin: 0;
  }
  .shelf-count{ font-size: 12px; color: var(--text-muted); }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
  }

  .cart{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-cart);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    clip-path: polygon(0 10px, 30% 10px, 34% 0, 66% 0, 70% 10px, 100% 10px, 100% 100%, 0 100%);
  }

  .cart-cover{
    aspect-ratio: 1 / 1;
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border-soft);
  }
  .cart-cover img{ width: 100%; height: 100%; object-fit: cover; display: block; }

  .cart-name{
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .cart-meta{ font-size: 11px; color: var(--text-muted); }
  .cart-meta.warn{ color: var(--danger-bright); }

  .cart-actions{ display: flex; gap: 8px; margin-top: 2px; }
  .cart-actions .btn{ flex: 1; padding: 8px 10px; font-size: 12.5px; }
  .cart-actions .btn-danger{ flex: 0 0 auto; padding: 8px 10px; }

  .empty{
    border: 1px dashed var(--border-soft);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty strong{ color: var(--text-primary); display: block; margin-bottom: 6px; font-size: 15px; }
  .empty p{ margin: 0 0 18px; font-size: 13.5px; max-width: 46ch; margin-inline: auto; }

  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(10,9,14,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay[hidden]{ display: none; }

  .modal{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 380px;
  }
  .modal h3{ font-family: var(--font-pixel); font-size: 12px; margin: 0 0 18px; line-height: 1.6; }
  .field{ margin-bottom: 16px; }
  .field label{ display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input[type="text"]{
    width: 100%;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text-primary);
    font-size: 14px;
  }
  .cover-pick{ display: flex; align-items: center; gap: 12px; }
  .cover-pick .preview{
    width: 56px; height: 56px;
    border-radius: 6px;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border-soft);
    overflow: hidden;
    flex-shrink: 0;
  }
  .cover-pick .preview img{ width: 100%; height: 100%; object-fit: cover; }
  .modal-actions{ display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions .btn{ flex: 1; }
  .modal-note{ font-size: 11.5px; color: var(--text-muted); margin-top: 14px; line-height: 1.5; }

  /* Player View (RetroArch Web Frame) */
  .player-view{ display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .player-view[hidden]{ display: none; }

  .console{
    width: 100%;
    max-width: 900px;
    background: linear-gradient(160deg, var(--shell-bright), var(--shell));
    border-radius: 22px;
    padding: 18px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12), 0 20px 50px rgba(0,0,0,0.35);
  }
  .console-label{
    font-family: var(--font-pixel);
    font-size: 10px;
    color: rgba(23,20,37,0.75);
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  .screen-frame{
    background: #0c0b10;
    border-radius: 10px;
    padding: 6px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4);
  }
  #retro-frame{
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 4px;
    border: none;
    display: block;
  }

  .player-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 900px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .player-title{ font-size: 14px; font-weight: 600; }
  .player-hint{
    font-size: 12.5px;
    color: var(--text-muted);
    max-width: 600px;
    text-align: center;
    line-height: 1.5;
    margin: 0;
  }

  .toast{
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--bg-panel-raised);
    border: 1px solid var(--border-soft);
    color: var(--text-primary);
    padding: 12px 18px;
    border-radius: 9px;
    font-size: 13px;
    max-width: 90vw;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .toast[hidden]{ display: none; }
</style>
</head>
<body>

<div class="app">

  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>ESTANTE GBA</h1>
        <p>Tu colección de cartuchos y emulación web</p>
      </div>
    </div>
    <div>
      <button class="btn btn-primary" id="open-add">Insertar cartucho</button>
    </div>
  </header>

  <main id="library-view">
    <div class="shelf-heading">
      <h2>Tu estantería</h2>
      <span class="shelf-count" id="shelf-count"></span>
    </div>
    <div id="grid" class="grid" hidden></div>
    <div id="empty" class="empty" hidden>
      <strong>La estantería está vacía</strong>
      <p>Sube un archivo .gba para agregar tu primer juego a la colección.</p>
      <button class="btn btn-primary" id="open-add-empty">Insertar cartucho</button>
    </div>
  </main>

  <section class="player-view" id="player-view" hidden>
    <div class="player-bar">
      <span class="player-title" id="player-title"></span>
      <button class="btn btn-ghost" id="exit-player">Volver al estante</button>
    </div>
    <div class="console">
      <div class="console-label">RETROARCH WEB ENGINE</div>
      <div class="screen-frame">
        <iframe id="retro-frame" src=""></iframe>
      </div>
    </div>
    <p class="player-hint">Los guardados internos del juego se gestionan directamente en el navegador de forma automática.</p>
  </section>

</div>

<!-- Modal para agregar cartuchos -->
<div class="overlay" id="add-overlay" hidden>
  <div class="modal">
    <h3>NUEVO CARTUCHO</h3>
    <div class="field">
      <label for="game-name">Nombre del juego</label>
      <input type="text" id="game-name" maxlength="60" placeholder="Ej. Mi ROM">
    </div>
    <div class="field">
      <label>Portada (opcional)</label>
      <div class="cover-pick">
        <div class="preview" id="cover-preview"></div>
        <button class="btn btn-ghost" id="pick-cover" type="button">Elegir imagen</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-add" type="button">Cancelar</button>
      <button class="btn btn-primary" id="confirm-add" type="button">Agregar</button>
    </div>
    <p class="modal-note" id="add-note"></p>
  </div>
</div>

<input type="file" id="rom-input" accept=".gba,.zip">
<input type="file" id="cover-input" accept="image/*">
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  "use strict";

  var COVER_SIZE = 300;
  var romBlobs = {};      
  var pendingRom = null;  
  var pendingCoverDataUrl = null;
  var reuploadTargetId = null; 

  var els = {
    grid: document.getElementById('grid'),
    empty: document.getElementById('empty'),
    shelfCount: document.getElementById('shelf-count'),
    openAdd: document.getElementById('open-add'),
    openAddEmpty: document.getElementById('open-add-empty'),
    addOverlay: document.getElementById('add-overlay'),
    romInput: document.getElementById('rom-input'),
    coverInput: document.getElementById('cover-input'),
    gameName: document.getElementById('game-name'),
    coverPreview: document.getElementById('cover-preview'),
    pickCover: document.getElementById('pick-cover'),
    cancelAdd: document.getElementById('cancel-add'),
    confirmAdd: document.getElementById('confirm-add'),
    addNote: document.getElementById('add-note'),
    playerView: document.getElementById('player-view'),
    libraryView: document.getElementById('library-view'),
    playerTitle: document.getElementById('player-title'),
    exitPlayer: document.getElementById('exit-player'),
    retroFrame: document.getElementById('retro-frame'),
    toast: document.getElementById('toast')
  };

  function showToast(msg, ms){
    els.toast.textContent = msg;
    els.toast.hidden = false;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ els.toast.hidden = true; }, ms || 3200);
  }

  function uid(){
    return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function fmtSize(bytes){
    if(bytes > 1024*1024) return (bytes/(1024*1024)).toFixed(1) + ' MB';
    return Math.max(1, Math.round(bytes/1024)) + ' KB';
  }

  /* IndexedDB Storage */
  var DB_NAME = 'estante-retro-db';
  var DB_VERSION = 1;
  var dbPromise = null;

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
        if(!db.objectStoreNames.contains('roms')) db.createObjectStore('roms');
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }

  function idbGet(store, key){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readonly');
        var req = tx.objectStore(store).get(key);
        req.onsuccess = function(){ resolve(req.result === undefined ? null : req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }

  function idbSet(store, key, value){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(value, key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function idbDelete(store, key){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  async function loadLibrary(){
    try { var list = await idbGet('meta', 'library'); return list || []; } catch(e){ return []; }
  }

  async function saveLibrary(list){
    try { await idbSet('meta', 'library', list); } catch(e){}
  }

  async function tryStoreRom(id, buffer){
    try {
      await idbSet('roms', id, new Blob([buffer], { type: 'application/octet-stream' }));
      return { ok: true };
    } catch(e){ return { ok: false }; }
  }

  async function render(){
    var list = await loadLibrary();
    els.shelfCount.textContent = list.length ? (list.length + (list.length === 1 ? ' cartucho' : ' cartuchos')) : '';

    if(!list.length){
      els.grid.hidden = true;
      els.empty.hidden = false;
      return;
    }
    els.empty.hidden = true;
    els.grid.hidden = false;
    els.grid.innerHTML = '';

    list.slice().reverse().forEach(function(game){
      var card = document.createElement('div');
      card.className = 'cart';

      var cover = document.createElement('div');
      cover.className = 'cart-cover';
      var img = document.createElement('img');
      img.src = game.cover;
      cover.appendChild(img);

      var name = document.createElement('div');
      name.className = 'cart-name';
      name.textContent = game.name;

      var meta = document.createElement('div');
      meta.className = 'cart-meta';
      meta.textContent = fmtSize(game.size);

      var actions = document.createElement('div');
      actions.className = 'cart-actions';

      var playBtn = document.createElement('button');
      playBtn.className = 'btn btn-primary';
      playBtn.textContent = 'Jugar';
      playBtn.addEventListener('click', function(){ playGame(game); });

      var delBtn = document.createElement('button');
      delBtn.className = 'btn btn-danger';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', async function(){
        if(confirm('¿Eliminar este cartucho?')){
          await idbDelete('roms', game.id);
          var updated = (await loadLibrary()).filter(function(g){ return g.id !== game.id; });
          await saveLibrary(updated);
          render();
        }
      });

      actions.appendChild(playBtn);
      actions.appendChild(delBtn);
      card.appendChild(cover);
      card.appendChild(name);
      card.appendChild(meta);
      card.appendChild(actions);
      els.grid.appendChild(card);
    });
  }

  /* Modales y subida */
  function openAddModal(){
    pendingRom = null;
    pendingCoverDataUrl = null;
    els.gameName.value = '';
    els.coverPreview.innerHTML = '';
    els.romInput.value = '';
    els.addOverlay.hidden = false;
    els.romInput.click();
  }

  els.openAdd.addEventListener('click', openAddModal);
  els.openAddEmpty.addEventListener('click', openAddModal);
  els.cancelAdd.addEventListener('click', function(){ els.addOverlay.hidden = true; });

  els.romInput.addEventListener('change', function(){
    var file = els.romInput.files[0];
    if(!file){ els.addOverlay.hidden = true; return; }
    var reader = new FileReader();
    reader.onload = function(){
      pendingRom = { buffer: reader.result, size: reader.result.byteLength, name: file.name.replace(/\.[^/.]+$/, "") };
      els.gameName.value = pendingRom.name;
    };
    reader.readAsArrayBuffer(file);
  });

  els.pickCover.addEventListener('click', function(){ els.coverInput.click(); });
  els.coverInput.addEventListener('change', async function(){
    var file = els.coverInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      pendingCoverDataUrl = e.target.result;
      els.coverPreview.innerHTML = '<img src="' + pendingCoverDataUrl + '">';
    };
    reader.readAsDataURL(file);
  });

  els.confirmAdd.addEventListener('click', async function(){
    if(!pendingRom) return;
    var id = uid();
    var name = els.gameName.value.trim() || pendingRom.name;
    var cover = pendingCoverDataUrl || 'https://via.placeholder.com/300?text=' + encodeURIComponent(name);

    await tryStoreRom(id, pendingRom.buffer);
    var list = await loadLibrary();
    list.push({ id: id, name: name, cover: cover, size: pendingRom.size });
    await saveLibrary(list);

    els.addOverlay.hidden = true;
    render();
    showToast('Cartucho agregado con éxito');
  });

  async function playGame(game){
    var blob = await idbGet('roms', game.id);
    if(!blob){ showToast('No se encontró el archivo ROM.'); return; }

    var romUrl = URL.createObjectURL(blob);
    // Usamos mGBA en WebRetro para GBA. En el futuro para 3D solo cambias el parámetro core (ej. 'swanstation' para PS1)
    var core = 'mgba'; 
    var webRetroUrl = 'https://binbashbanana.github.io/webretro/?core=' + core + '&rom=' + encodeURIComponent(romUrl);

    els.libraryView.hidden = true;
    els.playerView.hidden = false;
    els.playerTitle.textContent = game.name;
    els.retroFrame.src = webRetroUrl;
  }

  els.exitPlayer.addEventListener('click', function(){
    els.retroFrame.src = '';
    els.playerView.hidden = true;
    els.libraryView.hidden = false;
  });

  render();
})();
</script>

</body>
</html>
